<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4E97C4" />
      <stop offset="100%" stop-color="#134870" />
    </linearGradient>
  </defs>
  <!-- iOS가 모서리를 알아서 둥글게 마스킹하므로 배경은 꽉 찬 정사각형이어야 함 -->
  <rect x="0" y="0" width="100" height="100" fill="url(#bg)" />

  <!-- 이니셜 "T" - 폰트 의존 없이 벡터 도형으로 직접 그려서 어디서든 동일하게 렌더링 -->
  <rect x="24" y="27" width="52" height="13" rx="6" fill="#F6F7F2" />
  <rect x="43.5" y="27" width="13" height="46" rx="6" fill="#F6F7F2" />
</svg>
